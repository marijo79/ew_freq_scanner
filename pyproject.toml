[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freqscan"
version = "0.1.0"
description = "EW Frequency Scanner — live spectrum/waterfall plotting for RTL-SDR and HackRF"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "matplotlib>=3.8,<4",
    "pydantic-settings>=2.6",
    "confluent-kafka>=2.3,<3",
    "aws-msk-iam-sasl-signer-python>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Only needed for PLOT_BACKEND=pyqtgraph (see freqscan.config.Settings.plot_backend) --
# matplotlib (the default) needs none of this.
plot-pyqtgraph = [
    "pyqtgraph>=0.13",
    "PySide6>=6.5",
]

[tool.setuptools.packages.find]
where = ["src"]
